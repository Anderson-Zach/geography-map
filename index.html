<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>WWII Europe Bombing Map</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h2>WWII Allied Bombing Operations</h2>
    <div style="width: 500px;" id="slider-date"></div>
    
    <button class="btn btn-danger" onclick="updateData()">Update</button>
    <button class="btn btn-danger" onclick="playInterval()"> Play timelapse</button>
    
    <div class="input-group mb-3">
        <span class="input-group-text" id="basic-addon1">Start:</span>
        <input id="event-start" type="text" class="form-control" placeholder="01/08/1939" aria-label="Username"
            aria-describedby="basic-addon1">
    </div>
    <div class="input-group mb-3">
        <span  class="input-group-text" id="basic-addon1">End:</span>
        <input id="event-end" type="text" class="form-control" placeholder="13/05/1945">
    </div>

    <div id="map-container"></div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/noUiSlider/15.7.1/nouislider.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
        <script src="https://unpkg.com/topojson-client@3"></script>
    <script src="https://cdn.jsdelivr.net/npm/wnumb@1.2.0/wNumb.min.js"></script>
    <script src="slider.js"></script>

    <script src="index.js"></script>

</html>
